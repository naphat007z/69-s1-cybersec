services:
  db:
    image: postgres:16-alpine
    container_name: 69-s1-db
    ports:
      - "54327:5432"
    environment:
      POSTGRES_USER: naphat
      POSTGRES_PASSWORD: Nap007xHat
      POSTGRES_DB: naphat
    volumes:
      - ./data/data:/var/lib/postgresql/data

  admin:
    image: dpage/pgadmin4
    container_name: 69-s1-admin
    ports:
      - "8081:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: naphat@gmail.com
      PGADMIN_DEFAULT_PASSWORD: Nap007xHat
    volumes:
      - data-pgadmin:/var/lib/pgadmin

  app:
    image: prawee/strapi
    container_name: 69-s1-app
    ports:
      - "9091:1337"
    environment:
      DATABASE_CLIENT: postgres
      DATABASE_HOST: 69-s1-db
      DATABASE_PORT: 5432
      DATABASE_NAME: naphat
      DATABASE_USERNAME: naphat
      DATABASE_PASSWORD: Nap007xHat

volumes:
  data-pgadmin: